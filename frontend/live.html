<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE Live</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div>
      <h1>PULSE</h1>
      <p class="subtitle">Live monitoring</p>
    </div>
    <a href="/" class="status">Back to dashboard</a>
  </header>

  <main>
    <section class="score-hero">
      <div>
        <div class="value" id="live-posture">-</div>
        <div class="label" id="live-state">Waiting for monitor</div>
      </div>
      <p class="tip" id="live-tip">Run python monitor\monitor.py to start.</p>
      <div style="margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <a id="btn-live-start" href="pulse://start" style="display: inline-flex; align-items: center; gap: 6px; background: #6366f1; color: #ffffff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px;">▶ Launch App (pulse://start)</a>
        <a id="btn-live-download" href="https://github.com/alihaider/pulse/releases/latest" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; background: #ffffff; color: #1e293b; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; border: 1px solid #cbd5e1;">⬇ Download Windows Installer</a>
      </div>
    </section>

    <section class="cards">
      <div class="card cyan"><h3>Warnings</h3><p id="live-warnings">-</p></div>
      <div class="card good"><h3>Good</h3><p id="live-good">-</p></div>
      <div class="card poor"><h3>Poor</h3><p id="live-poor">-</p></div>
      <div class="card"><h3>Session</h3><p id="live-session">-</p></div>
    </section>

    <p class="note">Updates every 2 seconds.</p>
  </main>

  <script src="/js/live.js"></script>
</body>
</html>
