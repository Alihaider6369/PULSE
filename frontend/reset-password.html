<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE — Reset Password</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .reset-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
    }
    button {
      width: 100%;
      background: #6366f1;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #4f46e5;
    }
    .msg-box {
      font-size: 13px;
      margin-top: 14px;
      min-height: 20px;
    }
    .error { color: #ef4444; }
    .success { color: #10b981; }
  </style>
</head>
<body>
  <div class="reset-card">
    <h2 style="margin-top: 0; font-size: 22px;">Reset Your Password</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 24px;">Enter your new password below (at least 8 characters).</p>

    <div id="reset-form-container">
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="••••••••" required>
      </div>
      <button id="btn-submit-reset">Update Password</button>
      <div id="msg-area" class="msg-box"></div>
    </div>

    <div style="margin-top: 20px; text-align: center; font-size: 13px;">
      <a href="/" style="color: #6366f1; text-decoration: none;">&larr; Back to Dashboard</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");
    const msgArea = document.getElementById("msg-area");
    const submitBtn = document.getElementById("btn-submit-reset");

    if (!token) {
      msgArea.className = "msg-box error";
      msgArea.textContent = "Invalid or missing reset token.";
      submitBtn.disabled = true;
    }

    submitBtn.addEventListener("click", async () => {
      msgArea.textContent = "";
      const newPassword = document.getElementById("new-password").value.trim();
      const confirmPassword = document.getElementById("confirm-password").value.trim();

      if (!newPassword || newPassword.length < 8) {
        msgArea.className = "msg-box error";
        msgArea.textContent = "Password must be at least 8 characters long";
        return;
      }

      if (newPassword !== confirmPassword) {
        msgArea.className = "msg-box error";
        msgArea.textContent = "Passwords do not match.";
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = "Updating...";
        const targetUrl = window.getPulseApiUrl ? window.getPulseApiUrl("/api/auth/reset-password") : "/api/auth/reset-password";
        const res = await fetch(targetUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, new_password: newPassword }),
        });
        const data = await res.json();
        if (res.ok) {
          msgArea.className = "msg-box success";
          msgArea.textContent = data.message || "Password updated. You can now sign in.";
          document.getElementById("new-password").disabled = true;
          document.getElementById("confirm-password").disabled = true;
          submitBtn.textContent = "Password Updated";
        } else {
          msgArea.className = "msg-box error";
          msgArea.textContent = data.detail || "Failed to update password.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";
        }
      } catch (err) {
        msgArea.className = "msg-box error";
        msgArea.textContent = "Network error. Please try again.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
