services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: pulse_prod
      POSTGRES_USER: pulse_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_admin -d pulse_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pulse_admin:${POSTGRES_PASSWORD}@db:5432/pulse_prod
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
